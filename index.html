<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XCESS Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
font-family:Arial;
color:#fff;
overflow-x:hidden;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:#0a0a0a;
border-bottom:1px solid #111;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:26px;
color:#39ff14;
font-weight:bold;
cursor:pointer;
user-select:none;
}

.header-cats{
display:flex;
gap:10px;
}

.header-cats div{
background:#111;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
}

.header-cats .active{
background:#39ff14;
color:#000;
}

.btn{
background:#39ff14;
color:#000;
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

/* PRODUCTS */
.products{padding:40px}

.grid{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:20px;
}

@media (max-width: 900px){
.grid{
grid-template-columns:repeat(2, 1fr);
}
}

@media (max-width: 600px){
.grid{
grid-template-columns:repeat(1, 1fr);
}
}

.card{
background:#0f0f0f;
border:1px solid #222;
border-radius:14px;
padding:15px;
text-align:center;
cursor:pointer;
transition:0.3s ease;

height:300px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.card img{
width:100%;
height:160px;
object-fit:contain;
border-radius:10px;
background:#000;
padding:10px;
}

.card h3{
font-size:15px;
margin-top:10px;
color:#fff;
}

.card div{
color:#39ff14;
font-weight:bold;
font-size:16px;
}

.card:hover{
transform:translateY(-5px);
border-color:#39ff14;
box-shadow:0 0 15px rgba(57,255,20,0.2);
}

/* MODALS */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.box{
background:#111;
padding:20px;
border-radius:12px;
width:360px;
border:1px solid #39ff14;
max-height:85vh;
overflow:auto;
}

/* CART */
.cart-item{
background:#000;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #222;
}

/* SLIDER */

.slides{
position:relative;
width:100%;
height:100%;
}

.slide{
position:absolute;
inset:0;
opacity:0;
transition:opacity 1s ease;
z-index:0;
}

.slide.active{
opacity:1;
z-index:1;
}

.slides img{
flex:0 0 100%;
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.whatsapp-btn{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:#fff;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
z-index:9999;
text-decoration:none;
}

#colors span{
display:inline-block;
padding:6px 10px;
margin:5px;
border:1px solid #333;
border-radius:8px;
cursor:pointer;
background:#000;
}

#colors span.active{
background:#39ff14;
color:#000;
border-color:#39ff14;
}

/* ADMIN */
.admin-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:10000;
}

.admin-box{
width:350px;
background:#111;
padding:20px;
border-radius:15px;
border:1px solid #39ff14;
}

.admin-box input{
width:100%;
padding:10px;
margin:8px 0;
background:#000;
border:1px solid #222;
color:#fff;
border-radius:8px;
}

.checkout-box{
width:380px;
background:linear-gradient(145deg,#111,#0a0a0a);
padding:25px;
border-radius:18px;
border:1px solid #39ff14;
box-shadow:0 0 25px rgba(57,255,20,0.15);
text-align:center;
animation:pop .25s ease;
}

@keyframes pop{
from{transform:scale(.9);opacity:0}
to{transform:scale(1);opacity:1}
}

.checkout-box h2{color:#39ff14;margin-bottom:5px}
.sub{font-size:13px;color:#aaa;margin-bottom:15px}

.form input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #222;
background:#000;
color:#fff;
}

.buttons{display:flex;gap:10px;margin-top:10px}

.btn.send{flex:1;background:#39ff14;color:#000;font-weight:bold}
.btn.cancel{flex:1;background:#222;color:#fff}

#checkoutModal{
display:none;
}

.checkout-box input{
transition:0.2s;
}

.checkout-box input:focus{
border-color:#39ff14;
outline:none;
box-shadow:0 0 10px rgba(57,255,20,0.2);
}





.slider{
width:100%;
aspect-ratio:3/1;
overflow:hidden;
position:relative;
}

.slides{
position:relative;
width:100%;
height:100%;
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition:1s ease;
}

.slide.active{
opacity:1;
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
}

.caption{
position:absolute;
bottom:20px;
right:20px;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
color:#fff;
}

.caption button{
background:#39ff14;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}

.add-btn{
margin-top:10px;
width:100%;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
background:#39ff14;
color:#000;
font-weight:bold;
transition:0.3s;
}

.add-btn:hover{
transform:scale(1.05);
box-shadow:0 0 10px rgba(57,255,20,0.4);
}


#welcome{
position:fixed;
inset:0;
background:linear-gradient(135deg,#000,#0a0a0a);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
overflow:hidden;
}

.welcome-box{
text-align:center;
z-index:2;
}

.welcome-box h1{
font-size:40px;
color:#39ff14;
letter-spacing:3px;
}

.welcome-box p{
color:#aaa;
margin-top:10px;
}

.float-item{
position:absolute;
font-size:28px;
opacity:0.15;
animation:float 6s infinite linear;
filter:drop-shadow(0 0 6px #39ff14);
}

.float-item.green{
color:#39ff14;
text-shadow:0 0 10px #39ff14;
}

@keyframes float{
0%{transform:translateY(100vh) scale(0.5); opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-10vh) scale(1.2); opacity:0;}
}

/* أماكن عشوائية */
.float-item:nth-child(2){left:10%; animation-delay:0s;}
.float-item:nth-child(3){left:25%; animation-delay:1s;}
.float-item:nth-child(4){left:40%; animation-delay:2s;}
.float-item:nth-child(5){left:60%; animation-delay:3s;}
.float-item:nth-child(6){left:75%; animation-delay:4s;}
.float-item:nth-child(7){left:90%; animation-delay:5s;}

html {
  scroll-behavior: smooth;
}

header{
transition: box-shadow 0.3s ease, background 0.3s ease;
}

.section-divider{
  height:1px;
  width:90%;
  margin:40px auto;
  background:linear-gradient(
    to right,
    transparent,
    rgba(57,255,20,0.6),
    transparent
  );
  opacity:0.7;
} 

.card{
opacity:0;
transform:translateY(10px);
animation:fadeIn .4s ease forwards;
}

@keyframes fadeIn{
to{
opacity:1;
transform:translateY(0);
}
}



.slide img{
transition:transform 6s ease;
}

.slide.active img{
transform:scale(1.05);
}



body::after{
content:"🎧 📱 🔋 ⚡";
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:80px;
opacity:0.03;
pointer-events:none;
}



#similarBox{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:10px;
}

@media(max-width:600px){
#similarBox{
grid-template-columns:repeat(2,1fr);
}
}




/* 🔥 إصلاح عرض الهاتف */

@media (max-width: 768px){

header{
padding:12px 10px;
flex-wrap:wrap;
gap:10px;
}

.header-cats{
flex-wrap:wrap;
justify-content:center;
}

.grid{
grid-template-columns:repeat(2, 1fr);
gap:10px;
}

.card{
height:auto;
}

.box{
width:95vw !important;
}

.checkout-box{
width:95vw !important;
}

.admin-box{
width:90vw !important;
}

.slider{
aspect-ratio:16/9;
}

#search{
width:100px !important;
}

.btn{
padding:8px 10px;
font-size:12px;
}

.logo{
font-size:20px;
}

}

/* 📱 شاشات أصغر جداً */
@media (max-width: 480px){

.grid{
grid-template-columns:repeat(1, 1fr);
}

.header-cats div{
padding:5px 8px;
font-size:12px;
}

}

</style>
</head>

<body>

  <!-- نافذة الترحيب -->

  <div id="welcome">
  <div class="welcome-box">
    <h1>PITAKA STORE</h1>
    <p>مرحباً بك في عالم الإكسسوارات </p>
  </div>

  <!-- عناصر متطايرة -->
  <div class="float-item green">🎧</div>
<div class="float-item green">🔋</div>
<div class="float-item green">📱</div>
<div class="float-item green">⚡</div>
<div class="float-item green">🎧</div>
<div class="float-item green">🔌</div>
<div class="float-item green">🎮</div>
<div class="float-item green">🎧</div>
<div class="float-item green">🔋</div>
</div>



<header>
<div class="logo" id="logo">PITAKA STORE</div>

<div class="header-cats">
<div class="active" onclick="setCat('all',this)">الكل</div>

<div onclick="setCat('audio',this)">سماعات</div>

<div onclick="setCat('case',this)">حافظات</div>
<div onclick="setCat('charger',this)">شواحن</div>
</div>

<input type="text" id="search" placeholder="بحث..." onkeyup="render()"
style="padding:6px;border-radius:8px;border:none;background:#111;color:#fff;width:150px;">

<button class="btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</header>

<!-- SLIDER -->
<div class="slider">
  <div class="slides">

    <div class="slide active">
      <img src="img/hadset.jpeg">
      <div class="caption">
        <h2>عروض السماعات 🎧</h2>
        <button>تسوق الآن</button>
      </div>
    </div>

    <div class="slide">
      <img src="img/irpods.jpeg">
      <div class="caption">
        <h2>أحدث AirPods 🔥</h2>
        <button>تسوق الآن</button>
      </div>
    </div>

    <div class="slide">
      <img src="img/cass.jpeg">
      <div class="caption">
        <h2>حافظات 📱</h2>
        <button>تسوق الآن</button>
      </div>
    </div>

    <div class="slide">
      <img src="img/pwrpink.jpeg">
      <div class="caption">
        <h2>باور بنك 🔋</h2>
        <button>تسوق الآن</button>
      </div>
    </div>

    <div class="slide">
      <img src="img/carcharg.jpeg">
      <div class="caption">
        <h2>شواحن ⚡</h2>
        <button>تسوق الآن</button>
      </div>
    </div>

  </div>
</div>

<section class="products">
<div class="grid" id="grid"></div>
</section>

<!-- PRODUCT -->
<div class="modal" id="productModal">
<div class="box">
<img id="pImg" style="width:100%;height:180px;object-fit:contain">
<h2 id="pName"></h2>
<h3 id="pPrice" style="color:#39ff14"></h3>
<p id="pDesc"></p>

//غغغغ//
<h4 style="margin-top:15px;color:#39ff14">منتجات مشابهة</h4>
<div id="similarBox"></div>
<div id="colors"></div>

<br>
<button class="btn" onclick="addToCart()">أضف للسلة</button>
<button class="btn" onclick="closeProduct()">إغلاق</button>
</div>
</div>

<!-- CART -->
<div class="modal" id="cartModal">
<div class="box">

<h3>السلة 🛒</h3>

<input id="couponInput"
placeholder="كود الخصم (اختياري)"
style="width:100%;padding:10px;margin:10px 0;background:#000;color:#fff;border:1px solid #222;border-radius:8px;">

<button class="btn" onclick="applyCoupon()" style="width:100%;margin-bottom:10px;">
تطبيق الخصم
</button>

<div id="cartBox"></div>

<hr style="margin:10px 0;border:1px solid #222">

<h4>المجموع: $<span id="total">0</span></h4>

<button class="btn" onclick="openCheckout()">إتمام الطلب</button>
<button class="btn" onclick="closeCart()">إغلاق</button>

</div>
</div>

<!-- ADMIN -->
<div class="admin-modal" id="adminModal">
<div class="admin-box">
<h3>دخول الأدمن</h3>
<input id="adminUser" placeholder="يوزر">
<input id="adminPass" type="password" placeholder="رمز">
<button class="btn" onclick="loginAdmin()">دخول</button>
<button class="btn" onclick="closeAdmin()">إغلاق</button>
</div>
</div>

<script>



<!-- نافذة الترحيب -->

window.addEventListener("load", () => {

const welcome = document.getElementById("welcome");

/* توزيع العناصر */
document.querySelectorAll(".float-item").forEach(el => {
el.style.left = Math.random() * 100 + "%";
el.style.top = Math.random() * 100 + "%";
el.style.animationDuration = (4 + Math.random() * 4) + "s";
el.style.fontSize = (20 + Math.random() * 20) + "px";
});

/* إخفاء بعد 3 ثواني */
setTimeout(() => {
welcome.style.display = "none";
}, 3000);

});
/* DATA */
let products = JSON.parse(localStorage.getItem("products") || "[]");
let cart = [];
let currentCategory = "all";
let selectedColor = "";

/* FIX COUPON */
let appliedDiscount = 0;

const coupons = {
"ALI10": 10,
"ALI20": 20
};

function applyCoupon(){
let input = document.getElementById("couponInput");
if(!input) return;

let code = input.value.trim().toUpperCase();

if(code === ""){
appliedDiscount = 0;
renderCart();
return;
}

if(coupons[code]){
appliedDiscount = coupons[code];
}else{
appliedDiscount = 0;
}

renderCart();
}

/* PRODUCTS */
function render(){
let grid = document.getElementById("grid");
grid.innerHTML = "";

let search = document.getElementById("search").value.toLowerCase();

products.forEach((p,i)=>{
if((currentCategory=="all" || p.type==currentCategory) &&
(p.name||"").toLowerCase().includes(search)){

grid.innerHTML += `
<div class="card">

<img src="${p.image}" onclick="openProduct(${i})">

<h3>${p.name}</h3>

<div>$${p.price}</div>

<button class="add-btn" onclick="event.stopPropagation(); addToCartDirect(${i})">
أضف للسلة 🛒
</button>

</div>`;
}
});
}
render();

/* PRODUCT */
function openProduct(i){
const p = products[i];
if(!p) return;

pImg.src = p.image;
pName.innerText = p.name;
pPrice.innerText = "$" + p.price;
pDesc.innerText = p.desc;

let c = document.getElementById("colors");
c.innerHTML = "";

(p.colors || []).forEach(cl=>{
c.innerHTML += `<span onclick="selectColor(this,'${cl}')">${cl}</span>`;
});

productModal.style.display = "flex";

// 👇 هذا المهم
showSimilarProducts(i);
}


function closeProduct(){
productModal.style.display="none";
}

function selectColor(el,color){
selectedColor=color;
document.querySelectorAll("#colors span").forEach(e=>e.classList.remove("active"));
el.classList.add("active");
}

function addToCart(){
cart.push({
name:pName.innerText,
price:parseFloat(pPrice.innerText.replace("$","")),
color:selectedColor||"بدون",
qty:1
});
updateCart();
closeProduct();
}

function updateCart(){
document.getElementById("cartCount").innerText=cart.length;
}

/* CART */

function openCart(){
renderCart();
document.getElementById("cartModal").style.display="flex";
}

function closeCart(){
document.getElementById("cartModal").style.display="none";
}

function renderCart(){
let box=document.getElementById("cartBox");
box.innerHTML="";

let total=0;

if(cart.length===0){
box.innerHTML="السلة فارغة";
document.getElementById("total").innerText=0;
return;
}

cart.forEach((p,i)=>{
let subtotal=p.price*p.qty;
total+=subtotal;

box.innerHTML+=`
<div class="cart-item">
${p.name} (${p.color})
<br>
$${p.price} × ${p.qty} = ${subtotal}
<br>
<button onclick="plus(${i})">+</button>
<button onclick="minus(${i})">-</button>
<button onclick="removeItem(${i})">حذف</button>
</div>`;
});

let discount = total*(appliedDiscount/100);
let final = total - discount;
if(appliedDiscount > 0){
box.innerHTML += `<div style="color:#39ff14">تم تطبيق خصم ${appliedDiscount}%</div>`;
}

document.getElementById("total").innerText = final.toFixed(2);
}

function plus(i){cart[i].qty++;renderCart();}
function minus(i){cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);renderCart();}
function removeItem(i){cart.splice(i,1);renderCart();}

/* CATEGORY */
function setCat(t,el){
currentCategory=t;
document.querySelectorAll(".header-cats div").forEach(e=>e.classList.remove("active"));
el.classList.add("active");
render();
}

function openCheckout(){
document.getElementById("cartModal").style.display="none";
document.getElementById("checkoutModal").style.display="flex";
}

function closeCheckout(){
document.getElementById("checkoutModal").style.display="none";
}

function sendOrder(){

let name = document.getElementById("cName").value;
let phone = document.getElementById("cPhone").value;
let city = document.getElementById("cCity").value;
let point = document.getElementById("cPoint").value;

if(!name || !phone || !city || !point){
alert("⚠️ يرجى ملء جميع الحقول");
return;
}

let itemsText = cart.map((p, i) =>
`${i+1}- ${p.name}
   اللون: ${p.color}
   العدد: ${p.qty}
   السعر: $${p.price * p.qty}`
).join("\n\n");

let total = document.getElementById("total").innerText;

let whatsapp = "9647760986035";

let message = 
`🛒 *طلب جديد - XCESS STORE*
——————————————
👤 الاسم: ${name}
📞 الهاتف: ${phone}
🏙️ المحافظة: ${city}
📍 أقرب نقطة: ${point}
——————————————
📦 المنتجات:

${itemsText}

——————————————
💰 المجموع النهائي: $${total}
——————————————
📅 تم الطلب من الموقع`;

let url = "https://wa.me/" + whatsapp + "?text=" + encodeURIComponent(message);

window.open(url, "_blank");

// تفريغ السلة
cart = [];
updateCart();
document.getElementById("checkoutModal").style.display="none";
}



/* SLIDER */

/* SLIDER */

let index = 0;

function startSlider() {
  const slides = document.querySelectorAll(".slider .slide");

  if (slides.length < 2) return;

  slides.forEach((slide, i) => {
    slide.classList.remove("active");
    if (i === 0) slide.classList.add("active");
  });

  setInterval(() => {
    slides[index].classList.remove("active");

    index++;
    if (index >= slides.length) {
      index = 0;
    }

    slides[index].classList.add("active");
  }, 4000);
}

window.addEventListener("load", startSlider);
/* توزيع العناصر */
document.querySelectorAll(".float-item").forEach(el => {
  el.style.left = Math.random() * 100 + "%";
  el.style.top = Math.random() * 100 + "%";
  el.style.animationDuration = (4 + Math.random() * 4) + "s";
  el.style.fontSize = (20 + Math.random() * 20) + "px";
});

/* تشغيل السلايدر */
startSlider();

/* إخفاء الترحيب بعد 3 ثواني */
setTimeout(() => {
  welcome.style.display = "none";
}, 3000);

/* ADMIN */

const logo = document.getElementById("logo");
const adminModal = document.getElementById("adminModal");

let timer = null;

logo.addEventListener("pointerdown", () => {
  timer = setTimeout(() => {
    adminModal.style.display = "flex";
  }, 3000);
});

logo.addEventListener("pointerup", () => {
  clearTimeout(timer);
});

logo.addEventListener("pointerleave", () => {
  clearTimeout(timer);
});

logo.addEventListener("pointercancel", () => {
  clearTimeout(timer);
});

//هنا اضيف او احذف يوزر//

const users = [
{user:"admin", pass:"1234"},
{user:"ali", pass:"0000"},
{user:"shuber", pass:"2026"}
];

function loginAdmin(){

let u = adminUser.value;
let p = adminPass.value;

// نبحث إذا اليوزر والباسورد موجودين بالقائمة
let found = users.find(x => x.user === u && x.pass === p);

if(found){
window.location.href="admin.html";
}else{
alert("❌ خطأ في اليوزر أو الرمز");
}

}
function closeAdmin(){
document.getElementById("adminModal").style.display="none";
}

function showSimilarProducts(currentIndex){

let box = document.getElementById("similarBox");
box.innerHTML = "";

let current = products[currentIndex];
if(!current) return;

let filtered = products.filter((p,i)=>
p.type === current.type && i !== currentIndex
).slice(0,3); // 👈 فقط 3 منتجات

if(filtered.length === 0){
box.innerHTML = "<div style='color:#aaa;font-size:12px'>لا توجد منتجات مشابهة</div>";
