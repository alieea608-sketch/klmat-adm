<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XCESS Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:Arial;
padding:30px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#39ff14;
}

.back{
background:#111;
color:#39ff14;
padding:10px 14px;
border-radius:10px;
text-decoration:none;
border:1px solid #222;
}

.wrap{
display:grid;
grid-template-columns:380px 1fr;
gap:30px;
}

.box{
background:#111;
padding:20px;
border-radius:14px;
border:1px solid #222;
}

input, textarea, select{
width:100%;
padding:12px;
background:#000;
border:1px solid #222;
border-radius:10px;
color:#fff;
margin-bottom:12px;
font-size:14px;
}

textarea{
resize:none;
height:90px;
}

.btn{
width:100%;
padding:12px;
background:#39ff14;
color:#000;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.card{
background:#111;
padding:14px;
border-radius:12px;
border:1px solid #222;
}

.card img{
width:100%;
height:160px;
object-fit:contain;
background:#000;
border-radius:10px;
margin-bottom:10px;
}

.actions{
display:flex;
gap:8px;
margin-top:8px;
}

.small{
flex:1;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.edit{
background:#39ff14;
color:#000;
}

.del{
background:#ff3333;
color:#fff;
}

.badge{
display:inline-block;
padding:4px 8px;
background:#000;
border:1px solid #222;
border-radius:8px;
font-size:12px;
margin-top:6px;
}

#msg{
margin-top:10px;
color:#39ff14;
font-size:14px;
}
</style>
</head>
<body>

<header>
<div class="logo">PITAKA ADMIN</div>
<a href="index.html" class="back">← الرجوع للموقع</a>
</header>

<div class="wrap">

<div class="box">
<h3 style="margin-bottom:15px">إضافة / تعديل منتج</h3>

<input id="name" placeholder="اسم المنتج">
<input id="price" placeholder="السعر">

<select id="type">
<option value="">اختر القسم</option>
<option value="audio">سماعات</option>
<option value="case">حافظات</option>
<option value="charger">شواحن</option>
</select>

<textarea id="desc" placeholder="الوصف"></textarea>

<input id="colors" placeholder="الألوان مثال: أسود, أبيض, أخضر">

<input type="file" id="image" accept="image/*">

<button class="btn" onclick="saveProduct()">حفظ المنتج</button>

<div id="msg"></div>
</div>

<div class="box">
<input id="search" placeholder="ابحث عن منتج..." onkeyup="renderProducts()">
<div class="products" id="products"></div>
</div>

</div>

<script>
let products = JSON.parse(localStorage.getItem("products") || "[]");
let editingId = null;

function categoryName(type){
  if(type === "audio") return "سماعات";
  if(type === "case") return "حافظات";
  if(type === "charger") return "شواحن";
  return "";
}

function saveStorage(){
  localStorage.setItem("products", JSON.stringify(products));
}

function loadProducts(){
  products = JSON.parse(localStorage.getItem("products") || "[]");
  renderProducts();
}

function renderProducts(){
  const q = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("products");

  box.innerHTML = "";

  products
    .filter(p => (p.name || "").toLowerCase().includes(q))
    .forEach(p => {
      box.innerHTML += `
      <div class="card">
        <img src="${p.image || ''}">
        <h4>${p.name}</h4>
        <div>$${p.price}</div>
        <div class="badge">${categoryName(p.type)}</div>

        <div class="actions">
          <button class="small edit" onclick="editProduct(${p.id})">تعديل</button>
          <button class="small del" onclick="deleteProduct(${p.id})">حذف</button>
        </div>
      </div>
      `;
    });
}

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;

  editingId = id;

  document.getElementById("name").value = p.name || "";
  document.getElementById("price").value = p.price || "";
  document.getElementById("type").value = p.type || "";
  document.getElementById("desc").value = p.desc || "";
  document.getElementById("colors").value = (p.colors || []).join(",");
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveProduct(){
  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const type = document.getElementById("type").value;
  const desc = document.getElementById("desc").value.trim();

  const colors = document.getElementById("colors").value
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);

  const file = document.getElementById("image").files[0];

  if(!name || !price || !type){
    document.getElementById("msg").innerText = "أدخل الاسم والسعر والقسم";
    return;
  }

  let image = "";

  if(file){
    image = await fileToBase64(file);
  }

  if(editingId){
    const index = products.findIndex(x => x.id === editingId);
    const old = products[index];

    products[index] = {
      ...old,
      name,
      price,
      type,
      desc,
      colors,
      image: image || old.image
    };

    editingId = null;
    document.getElementById("msg").innerText = "تم تعديل المنتج";

  }else{
    products.unshift({
      id: Date.now(),
      name,
      price,
      type,
      desc,
      colors,
      image
    });

    document.getElementById("msg").innerText = "تمت إضافة المنتج";
  }

  saveStorage();
  clearForm();
  loadProducts();
}

function deleteProduct(id){
  if(!confirm("حذف المنتج؟")) return;

  products = products.filter(p => p.id !== id);

  saveStorage();
  loadProducts();
}

function clearForm(){
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("type").value = "";
  document.getElementById("desc").value = "";
  document.getElementById("colors").value = "";
  document.getElementById("image").value = "";
}

loadProducts();
</script>

</body>
</html>
